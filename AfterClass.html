<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Progress Dashboard</title>

https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css

<style>
body{
    background-color:#f8f9fa;
}
.subject-card{
    transition:0.3s;
}
.subject-card:hover{
    transform:scale(1.03);
}
</style>
</head>
<body>

<div class="container py-4">

    <!-- Jumbotron -->
    <div class="p-5 mb-4 bg-primary text-white rounded-3">
        <div class="container-fluid py-3">
            <h1 class="display-5 fw-bold">📚 Study Progress Dashboard</h1>
            <p class="fs-5">Track your lessons and monitor your learning journey.</p>
        </div>
    </div>

    <!-- Subject Buttons -->
    <h3 class="mb-3">Subjects</h3>

    <div class="mb-4">
        <button class="btn btn-primary m-1">Math</button>
        <button class="btn btn-success m-1">Science</button>
        <button class="btn btn-warning m-1">English</button>
        <button class="btn btn-danger m-1">History</button>
        <button class="btn btn-info m-1">Coding</button>
    </div>

    <!-- Lesson Counts -->
    <div class="row">

        <div class="col-md-4 mb-3">
            <div class="card subject-card">
                <div class="card-body">
                    <h5>
                        Math
                        <span class="badge bg-primary">12 Lessons</span>
                    </h5>
                    <div class="progress mt-3">
                        <div class="progress-bar bg-primary"
                             style="width:75%">
                            75%
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card subject-card">
                <div class="card-body">
                    <h5>
                        Science
                        <span class="badge bg-success">10 Lessons</span>
                    </h5>
                    <div class="progress mt-3">
                        <div class="progress-bar bg-success"
                             style="width:60%">
                            60%
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-3">
            <div class="card subject-card">
                <div class="card-body">
                    <h5>
                        English
                        <span class="badge bg-warning text-dark">8 Lessons</span>
                    </h5>
                    <div class="progress mt-3">
                        <div class="progress-bar bg-warning text-dark"
                             style="width:90%">
                            90%
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="card subject-card">
                <div class="card-body">
                    <h5>
                        History
                        <span class="badge bg-danger">6 Lessons</span>
                    </h5>
                    <div class="progress mt-3">
                        <div class="progress-bar bg-danger"
                             style="width:45%">
                            45%
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-3">
            <div class="card subject-card">
                <div class="card-body">
                    <h5>
                        Coding
                        <span class="badge bg-info text-dark">15 Lessons</span>
                    </h5>
                    <div class="progress mt-3">
                        <div class="progress-bar bg-info text-dark"
                             style="width:80%">
                            80%
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
